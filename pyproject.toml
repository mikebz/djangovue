[project]
name = "djangovue"
version = "0.1.0"
description = "Django + Vue application"
authors = [
    {name = "Mike Borozdin", email = "mike@example.com"},
]
readme = "README.md"
license = {text = "MIT"}
# Django 6.0 dropped Python 3.11; 3.12 is the floor for the whole project.
requires-python = ">=3.12"
dependencies = [
    "django>=6.0,<6.1",
    "django-vite>=3.1.0",
    "dj-database-url>=2.2.0",
    "gunicorn>=23.0.0",
    "python-dotenv>=1.2.2",
]

[project.scripts]
# Lets management commands run as `uv run manage <command>`.
manage = "djangovue.cli:main"

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.11.0",
    # Django ships no inline annotations; these stubs are what make the
    # `disallow_untyped_defs` type check meaningful across Django call sites.
    "django-stubs[compatible-mypy]>=6.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long, handled by black
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["djangovue", "backend"]

[tool.black]
line-length = 88
target-version = ['py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.mypy]
python_version = "3.12"
# `strict` turns on disallow_untyped_defs plus the rest of the strict family
# (untyped calls, untyped decorators, implicit Optional, Any returns).
strict = true
ignore_missing_imports = true
exclude = ["backend/migrations/"]
files = ["backend", "djangovue", "manage.py", "scripts/e2e_template_check.py"]
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
# The plugin imports these settings, so `make typecheck` must run with the
# environment from .env.example loaded - the Makefile does that for every target.
django_settings_module = "djangovue.settings"
