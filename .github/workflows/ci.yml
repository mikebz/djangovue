name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

# Read-only by default; no job here needs to write to the repository.
permissions:
  contents: read

# A new push to a pull request makes the in-flight run obsolete. Branch runs are
# left alone so every commit on master keeps its own status.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint and Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    # ruff, black and mypy read source only, so this job skips the frontend.
    - name: Setup toolchain
      uses: ./.github/actions/setup

    - name: Run Python lint and format checks
      run: make lint

    - name: Run static type checking
      run: make typecheck

  test:
    name: Tests and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup toolchain
      uses: ./.github/actions/setup
      with:
        node: "true"

    # `check`, `test` and `e2e` all render index.html through
    # frontend/dist/.vite/manifest.json, which does not exist on a fresh
    # checkout. Building first is what keeps them from failing spuriously.
    - name: Build frontend
      run: make frontend-build

    - name: Run Django checks, tests and end-to-end checks
      run: make check test e2e

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Build image
      run: make docker-build
